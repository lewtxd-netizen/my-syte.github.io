<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Бюджет</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Бюджет">
    <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=180&h=180&fit=crop">
    <!-- FontAwesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.9);
            --text-main: #1c1c1e;
            --text-secondary: #8e8e93;
            --tint-color: #007aff;
            --success-color: #34c759;
            --danger-color: #ff3b30;
            --warning-color: #ff9500;
            --dock-bg: rgba(255, 255, 255, 0.82);
            --modal-bg: rgba(255, 255, 255, 0.92);
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            --blur: blur(28px) saturate(190%);
        }

        [data-theme="dark"] {
            --bg-gradient: radial-gradient(circle at 50% 0%, #1a2238 0%, #0d1117 60%, #000000 100%);
            --card-bg: rgba(28, 28, 30, 0.72);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #f5f5f7;
            --text-secondary: #98989f;
            --tint-color: #0a84ff;
            --success-color: #32d74b;
            --danger-color: #ff453a;
            --warning-color: #ffd60a;
            --dock-bg: rgba(30, 30, 32, 0.82);
            --modal-bg: rgba(35, 35, 38, 0.94);
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            --blur: blur(36px) saturate(210%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: env(safe-area-inset-top, 20px) 16px calc(110px + env(safe-area-inset-bottom, 20px)) 16px;
            overflow-x: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .ambient-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.35;
            pointer-events: none;
            animation: floatGlow 12s ease-in-out infinite alternate;
        }
        .glow-1 { top: -50px; left: -50px; background: rgba(0, 122, 255, 0.4); }
        .glow-2 { bottom: 20%; right: -60px; background: rgba(52, 199, 89, 0.3); animation-delay: -4s; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.15); }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-top: 10px;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #34c759, #28a745);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 6px 16px rgba(52, 199, 89, 0.35);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: var(--blur);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            font-size: 16px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }
        .icon-btn:active { transform: scale(0.92); }

        .sync-badge {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 10px;
            background: rgba(52, 199, 89, 0.15);
            color: var(--success-color);
            border: 1px solid rgba(52, 199, 89, 0.3);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .balance-card {
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .balance-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .balance-amount {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 16px;
        }
        .balance-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--card-border);
        }
        .stat-item .label {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .stat-item .val {
            font-size: 16px;
            font-weight: 700;
            margin-top: 2px;
        }
        .stat-item.income .val { color: var(--success-color); }
        .stat-item.expense .val { color: var(--danger-color); }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        .grid-categories {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .cat-tile {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: var(--blur);
            border-radius: 20px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
        }
        .cat-tile:active { transform: scale(0.95); }
        .cat-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px auto;
            font-size: 18px;
            color: white;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .cat-name {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cat-spent {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .credits-widget {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .credits-info h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .credits-info p { font-size: 12px; color: var(--text-secondary); }

        .btn-primary {
            background: var(--tint-color);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 122, 255, 0.3);
            transition: transform 0.2s;
        }
        .btn-primary:active { transform: scale(0.97); }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            width: 100%;
            padding: 12px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Навигационная док-панель внизу */
        .dock {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: var(--dock-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-radius: 28px;
            padding: 8px 16px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            box-shadow: 0 16px 40px rgba(0,0,0,0.25);
            max-width: 440px;
            margin: 0 auto;
        }
        .dock-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-secondary);
            font-size: 10px;
            gap: 4px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 16px;
            transition: color 0.2s, background 0.2s;
        }
        .dock-item i { font-size: 20px; }
        .dock-item.active {
            color: var(--tint-color);
        }

        /* Модальные окна / шторки */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-sheet {
            background: var(--modal-bg);
            border-top: 1px solid var(--card-border);
            width: 100%;
            max-height: 90vh;
            border-radius: 32px 32px 0 0;
            padding: 24px 20px calc(40px + env(safe-area-inset-bottom, 20px)) 20px;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .modal-overlay.open .modal-sheet {
            transform: translateY(0);
        }
        .sheet-handle {
            width: 36px;
            height: 5px;
            background: var(--text-secondary);
            border-radius: 3px;
            margin: 0 auto 20px auto;
            opacity: 0.4;
        }
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: block;
        }
        .form-input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            font-size: 16px;
            color: var(--text-main);
            outline: none;
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 8px;
            margin-bottom: 16px;
        }
        .q-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 8px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
        }
        .q-btn:active { background: var(--tint-color); color: white; }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--card-border);
        }
        .tx-info h4 { font-size: 15px; font-weight: 600; }
        .tx-info p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .tx-sum { font-size: 16px; font-weight: 700; }
        .tx-sum.expense { color: var(--danger-color); }
        .tx-sum.income { color: var(--success-color); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Шапка -->
    <header>
        <div class="header-title-box">
            <div class="app-icon">
                <i class="fa-solid fa-money-bill-wave"></i>
            </div>
            <h1>Бюджет</h1>
        </div>
        <div class="header-actions">
            <div id="syncStatus" class="sync-badge" title="Статус синхронизации">
                <i class="fa-solid fa-cloud"></i> Локально
            </div>
            <button class="icon-btn" onclick="toggleTheme()" title="Сменить тему">
                <i class="fa-solid fa-circle-half-stroke" id="themeIcon"></i>
            </button>
            <button class="icon-btn" onclick="openSettingsModal()" title="Настройки">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </header>

    <!-- Вкладка: Главная -->
    <div id="tab-home" class="tab-content active">
        <!-- Баланс -->
        <div class="glass-card balance-card">
            <div class="balance-label">Доступный остаток</div>
            <div class="balance-amount" id="totalBalance">0 ₽</div>
            <button class="btn-primary" onclick="openIncomeModal()">
                <i class="fa-solid fa-plus"></i> Добавить зарплату / доход
            </button>
            <div class="balance-stats">
                <div class="stat-item income">
                    <div class="label">Доходы</div>
                    <div class="val" id="totalIncomeSum">0 ₽</div>
                </div>
                <div class="stat-item expense">
                    <div class="label">Расходы</div>
                    <div class="val" id="totalExpenseSum">0 ₽</div>
                </div>
            </div>
        </div>

        <!-- Популярные категории -->
        <div class="section-title">Категории расходов</div>
        <div class="grid-categories" id="categoriesGrid">
            <!-- Динамически заполняется скриптом -->
        </div>

        <!-- Кредиты и карты -->
        <div class="glass-card credits-widget" onclick="openCreditsModal()">
            <div class="credits-info">
                <h3>Кредиты и карты</h3>
                <p id="creditsSummary">0 активных карт/кредитов</p>
            </div>
            <i class="fa-solid fa-chevron-right" style="color: var(--text-secondary);"></i>
        </div>
    </div>

    <!-- Вкладка: Аналитика -->
    <div id="tab-analytics" class="tab-content">
        <div class="glass-card">
            <div class="section-title" style="margin-bottom: 16px;">Структура трат</div>
            <div id="analyticsBars">
                <!-- Прогресс бары категорий -->
            </div>
        </div>
    </div>

    <!-- Вкладка: История -->
    <div id="tab-history" class="tab-content">
        <div class="glass-card" style="margin-bottom: 12px; padding: 12px;">
            <input type="text" class="form-input" id="searchHistory" placeholder="Поиск по истории..." oninput="renderHistory()">
        </div>
        <div class="glass-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <div class="section-title" style="margin-bottom:0;">Все операции</div>
                <button class="q-btn" onclick="openImportModal()"><i class="fa-solid fa-file-import"></i> Импорт выписки</button>
            </div>
            <div id="historyList">
                <p style="color: var(--text-secondary); text-align: center; padding: 20px;">Нет операций</p>
            </div>
        </div>
    </div>

    <!-- Нижняя плавающая док-панель -->
    <nav class="dock">
        <button class="dock-item active" onclick="switchTab('home', this)">
            <i class="fa-solid fa-wallet"></i>
            <span>Главная</span>
        </button>
        <button class="dock-item" onclick="switchTab('analytics', this)">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Аналитика</span>
        </button>
        <button class="dock-item" onclick="switchTab('history', this)">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>История</span>
        </button>
    </nav>

    <!-- Модальное окно: Доход / Зарплата -->
    <div class="modal-overlay" id="incomeModal">
        <div class="modal-sheet">
            <div class="sheet-handle"></div>
            <div class="modal-title">Пополнение дохода</div>
            <div class="form-group">
                <label class="form-label">Сумма (₽)</label>
                <input type="number" class="form-input" id="incomeAmount" placeholder="50000">
            </div>
            <div class="form-group">
                <label class="form-label">Источник / Комментарий</label>
                <input type="text" class="form-input" id="incomeSource" placeholder="Зарплата / Аванс">
            </div>
            <button class="btn-primary" onclick="addIncome()">Внести доход</button>
            <button class="btn-secondary" onclick="closeModal('incomeModal')">Отмена</button>
        </div>
    </div>

    <!-- Модальное окно: Расход по категории -->
    <div class="modal-overlay" id="expenseModal">
        <div class="modal-sheet">
            <div class="sheet-handle"></div>
            <div class="modal-title" id="expenseModalTitle">Расход</div>
            <input type="hidden" id="expenseCatId">
            <div class="form-group">
                <label class="form-label">Сумма (₽)</label>
                <input type="number" class="form-input" id="expenseAmount" placeholder="1000">
                <div class="quick-amounts">
                    <button class="q-btn" onclick="quickSum(100)">+100</button>
                    <button class="q-btn" onclick="quickSum(500)">+500</button>
                    <button class="q-btn" onclick="quickSum(1000)">+1000</button>
                    <button class="q-btn" onclick="quickSum(5000)">+5000</button>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Комментарий (необязательно)</label>
                <input type="text" class="form-input" id="expenseComment" placeholder="Например: Пятерочка">
            </div>
            <button class="btn-primary" onclick="addExpense()">Добавить расход</button>
            <button class="btn-secondary" onclick="closeModal('expenseModal')">Отмена</button>
        </div>
    </div>

    <!-- Модальное окно: Кредиты и карты -->
    <div class="modal-overlay" id="creditsModal">
        <div class="modal-sheet">
            <div class="sheet-handle"></div>
            <div class="modal-title">Кредиты и карты</div>
            <div id="creditsListContainer" style="margin-bottom: 16px;">
                <!-- Список кредитов -->
            </div>
            <button class="btn-primary" onclick="openAddCreditModal()"><i class="fa-solid fa-plus"></i> Добавить карту / кредит</button>
            <button class="btn-secondary" onclick="closeModal('creditsModal')" style="margin-top: 10px;">Закрыть</button>
        </div>
    </div>

    <!-- Модальное окно: Добавление кредита/карты -->
    <div class="modal-overlay" id="addCreditModal">
        <div class="modal-sheet">
            <div class="sheet-handle"></div>
            <div class="modal-title">Новый продукт</div>
            <div class="form-group">
                <label class="form-label">Название</label>
                <input type="text" class="form-input" id="credName" placeholder="Тинькофф / Халва">
            </div>
            <div class="form-group">
                <label class="form-label">Тип</label>
                <select class="form-input" id="credType">
                    <option value="card">Кредитная карта</option>
                    <option value="loan">Кредит / Рассрочка</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Сумма долга / Лимита (₽)</label>
                <input type="number" class="form-input" id="credAmount" placeholder="30000">
            </div>
            <div class="form-group">
                <label class="form-label">Дата окончания льготного периода (грэйс)</label>
                <input type="date" class="form-input" id="credGraceDate">
            </div>
            <button class="btn-primary" onclick="saveCredit()">Сохранить</button>
            <button class="btn-secondary" onclick="closeModal('addCreditModal')">Назад</button>
        </div>
    </div>

    <!-- Модальное окно: Импорт выписки -->
    <div class="modal-overlay" id="importModal">
        <div class="modal-sheet">
            <div class="sheet-handle"></div>
            <div class="modal-title">Импорт банковской выписки</div>
            <div class="form-group">
                <label class="form-label">Вставьте текст СМС или выписки (CSV / строки)</label>
                <textarea class="form-input" id="importText" rows="6" placeholder="12.05 Пятерочка -450р&#10;13.05 Яндекс Такси -350р"></textarea>
            </div>
            <button class="btn-primary" onclick="processImport()">Распознать и импортировать</button>
            <button class="btn-secondary" onclick="closeModal('importModal')">Отмена</button>
        </div>
    </div>

    <!-- Модальное окно: Настройки -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-sheet">
            <div class="sheet-handle"></div>
            <div class="modal-title">Настройки</div>
            <div class="form-group">
                <label class="form-label">Тема оформления</label>
                <select class="form-input" id="themeSelector" onchange="changeThemeSetting(this.value)">
                    <option value="dark">Тёмная (Dark)</option>
                    <option value="light">Светлая (Light)</option>
                </select>
            </div>
            <div class="form-group" style="margin-top: 20px;">
                <label class="form-label">Резервное копирование</label>
                <button class="btn-secondary" onclick="exportData()"><i class="fa-solid fa-download"></i> Экспорт данных в файл</button>
                <button class="btn-secondary" onclick="document.getElementById('importFile').click()"><i class="fa-solid fa-upload"></i> Импорт из файла</button>
                <input type="file" id="importFile" style="display:none" onchange="importDataFile(event)">
            </div>
            <button class="btn-primary" onclick="closeModal('settingsModal')" style="margin-top: 20px;">Готово</button>
        </div>
    </div>

    <script>
        // ================= CONFIGURATION SUPABASE =================
        const SUPABASE_URL = 'https://araeagnsbsjlnraiwpxv.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_PvCN5tJ2UW2UTS_IxFuAVA_6tslftYH';
        
        let supabaseClient = null;
        if (SUPABASE_URL && SUPABASE_ANON_KEY) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // Состояние приложения
        let state = {
            theme: 'dark',
            incomes: [],
            expenses: [],
            credits: [],
            categories: [
                { id: 'supermarket', name: 'Продукты', icon: 'fa-cart-shopping', color: '#34c759', keywords: ['пятерочка', 'магнит', 'лента', 'перекресток', 'ашан', 'дикси', 'купер', 'вкусвилль', 'продукты'] },
                { id: 'transport', name: 'Транспорт', icon: 'fa-car', color: '#007aff', keywords: ['uber', 'яндекс такси', 'метро', 'автобус', 'каршеринг', 'драйв', 'бензин', 'заправка', 'азс'] },
                { id: 'marketplace', name: 'Маркетплейсы', icon: 'fa-bag-shopping', color: '#ff9500', keywords: ['wildberries', 'ozon', 'вайлдберриз', 'озон', 'маркет'] },
                { id: 'cafe', name: 'Кафе и Рестораны', icon: 'fa-utensils', color: '#ff3b30', keywords: ['ресторан', 'кафе', 'кофе', 'coffee', 'вкафе', 'додо', 'вкус точка', 'столовая', 'бар'] },
                { id: 'pharmacy', name: 'Аптеки и Здоровье', icon: 'fa-pills', color: '#af52de', keywords: ['аптека', 'лирика', 'ригла', 'здоровье', 'клиника', 'инвитро'] },
                { id: 'utility', name: 'ЖКХ и Связь', icon: 'fa-house-chimney', color: '#5856d6', keywords: ['мтс', 'билайн', 'теле2', 'мгтс', 'жкх', 'электричество', 'интернет', 'квартплата'] }
            ]
        };

        // Инициализация
        window.addEventListener('DOMContentLoaded', async () => {
            await loadData();
            applyTheme(state.theme);
            document.getElementById('themeSelector').value = state.theme;
            updateUI();
        });

        // Синхронизация с облаком / localStorage
        async function saveData() {
            localStorage.setItem('ios_budget_state', JSON.stringify(state));
            
            if (supabaseClient) {
                setSyncStatus('Синхронизация...', 'pending');
                try {
                    const { error } = await supabaseClient
                        .from('app_data')
                        .upsert({ id: 1, payload: state });
                    if (error) throw error;
                    setSyncStatus('В облаке', 'success');
                } catch (e) {
                    console.error('Ошибка Supabase:', e);
                    setSyncStatus('Ошибка сети', 'error');
                }
            } else {
                setSyncStatus('Локально', 'local');
            }
        }

        async function loadData() {
            if (supabaseClient) {
                try {
                    setSyncStatus('Загрузка...', 'pending');
                    const { data, error } = await supabaseClient
                        .from('app_data')
                        .select('payload')
                        .eq('id', 1)
                        .single();
                    if (data && data.payload) {
                        state = { ...state, ...data.payload };
                        setSyncStatus('В облаке', 'success');
                        return;
                    }
                } catch (e) {
                    console.error('Не удалось загрузить из Supabase:', e);
                }
            }
            
            const local = localStorage.getItem('ios_budget_state');
            if (local) {
                try { state = JSON.parse(local); } catch(e){}
            }
            setSyncStatus('Локально', 'local');
        }

        function setSyncStatus(text, type) {
            const badge = document.getElementById('syncStatus');
            let icon = 'fa-cloud';
            let color = 'var(--success-color)';
            if (type === 'pending') { icon = 'fa-spinner fa-spin'; color = 'var(--warning-color)'; }
            else if (type === 'error') { icon = 'fa-triangle-exclamation'; color = 'var(--danger-color)'; }
            else if (type === 'local') { icon = 'fa-database'; color = 'var(--text-secondary)'; }
            
            badge.innerHTML = `<i class="fa-solid ${icon}"></i> ${text}`;
            badge.style.color = color;
        }

        // Обновление интерфейса
        function updateUI() {
            const totalIncome = state.incomes.reduce((acc, item) => acc + item.amount, 0);
            const totalExpense = state.expenses.reduce((acc, item) => acc + item.amount, 0);
            const balance = totalIncome - totalExpense;

            document.getElementById('totalBalance').innerText = formatMoney(balance);
            document.getElementById('totalIncomeSum').innerText = formatMoney(totalIncome);
            document.getElementById('totalExpenseSum').innerText = formatMoney(totalExpense);

            renderCategoriesGrid();
            renderAnalytics();
            renderHistory();
            renderCreditsSummary();
        }

        function formatMoney(num) {
            return num.toLocaleString('ru-RU') + ' ₽';
        }

        function renderCategoriesGrid() {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = '';

            state.categories.forEach(cat => {
                const spent = state.expenses
                    .filter(e => e.categoryId === cat.id)
                    .reduce((sum, e) => sum + e.amount, 0);

                grid.innerHTML += `
                    <div class="cat-tile" onclick="openExpenseModal('${cat.id}', '${cat.name}')">
                        <div class="cat-icon" style="background: ${cat.color};">
                            <i class="fa-solid ${cat.icon}"></i>
                        </div>
                        <div class="cat-name">${cat.name}</div>
                        <div class="cat-spent">${formatMoney(spent)}</div>
                    </div>
                `;
            });
        }

        function renderAnalytics() {
            const container = document.getElementById('analyticsBars');
            container.innerHTML = '';

            const totalExpense = state.expenses.reduce((acc, item) => acc + item.amount, 0) || 1;

            state.categories.forEach(cat => {
                const spent = state.expenses
                    .filter(e => e.categoryId === cat.id)
                    .reduce((sum, e) => sum + e.amount, 0);
                const percent = Math.round((spent / totalExpense) * 100);

                container.innerHTML += `
                    <div style="margin-bottom: 12px;">
                        <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 4px;">
                            <span>${cat.name}</span>
                            <span>${formatMoney(spent)} (${percent}%)</span>
                        </div>
                        <div style="width: 100%; height: 8px; background: rgba(150,150,150,0.15); border-radius: 4px; overflow: hidden;">
                            <div style="width: ${percent}%; height: 100%; background: ${cat.color}; border-radius: 4px;"></div>
                        </div>
                    </div>
                `;
            });
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const query = document.getElementById('searchHistory').value.toLowerCase();
            
            let allTx = [
                ...state.incomes.map(i => ({ ...i, type: 'income', title: i.source || 'Доход', dateStr: new Date(i.date).toLocaleDateString() })),
                ...state.expenses.map(e => ({ ...e, type: 'expense', title: state.categories.find(c => c.id === e.categoryId)?.name || 'Расход', subtitle: e.comment, dateStr: new Date(e.date).toLocaleDateString() }))
            ];

            allTx.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (query) {
                allTx = allTx.filter(t => t.title.toLowerCase().includes(query) || (t.subtitle && t.subtitle.toLowerCase().includes(query)));
            }

            if (allTx.length === 0) {
                list.innerHTML = `<p style="color: var(--text-secondary); text-align: center; padding: 20px;">Операций не найдено</p>`;
                return;
            }

            list.innerHTML = '';
            allTx.forEach(tx => {
                const isInc = tx.type === 'income';
                list.innerHTML += `
                    <div class="transaction-item">
                        <div class="tx-info">
                            <h4>${tx.title}</h4>
                            <p>${tx.subtitle ? tx.subtitle + ' • ' : ''}${tx.dateStr}</p>
                        </div>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <div class="tx-sum ${isInc ? 'income' : 'expense'}">${isInc ? '+' : '-'}${formatMoney(tx.amount)}</div>
                            <button onclick="deleteTransaction('${tx.id}', '${tx.type}')" style="background:none; border:none; color:var(--text-secondary); cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        window.openIncomeModal = () => document.getElementById('incomeModal').classList.add('open');
        window.openExpenseModal = (catId, catName) => {
            document.getElementById('expenseCatId').value = catId;
            document.getElementById('expenseModalTitle').innerText = 'Расход: ' + catName;
            document.getElementById('expenseAmount').value = '';
            document.getElementById('expenseComment').value = '';
            document.getElementById('expenseModal').classList.add('open');
        };
        window.closeModal = (id) => document.getElementById(id).classList.remove('open');

        window.quickSum = (val) => {
            const inp = document.getElementById('expenseAmount');
            inp.value = (parseInt(inp.value) || 0) + val;
        };

        window.addIncome = async () => {
            const amount = parseFloat(document.getElementById('incomeAmount').value);
            const source = document.getElementById('incomeSource').value || 'Зарплата';
            if (!amount || amount <= 0) return alert('Введите корректную сумму');

            state.incomes.push({ id: 'inc_' + Date.now(), amount, source, date: new Date().toISOString() });
            await saveData();
            closeModal('incomeModal');
            updateUI();
        };

        window.addExpense = async () => {
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            const catId = document.getElementById('expenseCatId').value;
            const comment = document.getElementById('expenseComment').value;
            if (!amount || amount <= 0) return alert('Введите корректную сумму');

            state.expenses.push({ id: 'exp_' + Date.now(), amount, categoryId: catId, comment, date: new Date().toISOString() });
            await saveData();
            closeModal('expenseModal');
            updateUI();
        };

        window.deleteTransaction = async (id, type) => {
            if (type === 'income') {
                state.incomes = state.incomes.filter(i => i.id !== id);
            } else {
                state.expenses = state.expenses.filter(e => e.id !== id);
            }
            await saveData();
            updateUI();
        };

        window.openCreditsModal = () => {
            renderCreditsList();
            document.getElementById('creditsModal').classList.add('open');
        };
        window.openAddCreditModal = () => document.getElementById('addCreditModal').classList.add('open');

        window.saveCredit = async () => {
            const name = document.getElementById('credName').value;
            const type = document.getElementById('credType').value;
            const amount = parseFloat(document.getElementById('credAmount').value);
            const graceDate = document.getElementById('credGraceDate').value;
            if (!name || !amount) return alert('Заполните название и сумму');

            state.credits.push({ id: 'cred_' + Date.now(), name, type, amount, graceDate });
            await saveData();
            closeModal('addCreditModal');
            renderCreditsList();
            renderCreditsSummary();
        };

        function renderCreditsList() {
            const container = document.getElementById('creditsListContainer');
            if (state.credits.length === 0) {
                container.innerHTML = `<p style="color: var(--text-secondary); text-align: center;">Нет добавленных кредитов или карт</p>`;
                return;
            }
            container.innerHTML = '';
            state.credits.forEach(c => {
                let graceText = 'Без грэйса';
                let graceColor = 'var(--text-secondary)';
                if (c.graceDate) {
                    const days = Math.ceil((new Date(c.graceDate) - new Date()) / (1000 * 60 * 60 * 24));
                    if (days > 0) {
                        graceText = `Осталось дней грэйса: ${days}`;
                        graceColor = days < 5 ? 'var(--danger-color)' : 'var(--success-color)';
                    } else {
                        graceText = 'Льготный период истек!';
                        graceColor = 'var(--danger-color)';
                    }
                }
                container.innerHTML += `
                    <div class="transaction-item">
                        <div>
                            <h4>${c.name} (${c.type === 'card' ? 'Карта' : 'Кредит'})</h4>
                            <p style="color: ${graceColor}; font-size: 11px;">${graceText}</p>
                        </div>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <span style="font-weight:700;">${formatMoney(c.amount)}</span>
                            <button onclick="deleteCredit('${c.id}')" style="background:none; border:none; color:var(--text-secondary); cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        window.deleteCredit = async (id) => {
            state.credits = state.credits.filter(c => c.id !== id);
            await saveData();
            renderCreditsList();
            renderCreditsSummary();
        };

        function renderCreditsSummary() {
            const total = state.credits.reduce((sum, c) => sum + c.amount, 0);
            document.getElementById('creditsSummary').innerText = `${state.credits.length} продуктов • Общий долг: ${formatMoney(total)}`;
        }

        window.openImportModal = () => document.getElementById('importModal').classList.add('open');

        window.processImport = async () => {
            const text = document.getElementById('importText').value;
            if (!text.trim()) return alert('Вставьте текст выписки');

            const lines = text.split('
');
            let addedCount = 0;

            lines.forEach(line => {
                const lower = line.toLowerCase();
                const sumMatch = line.match(/[-]?\d+[\s,.]?\d*/);
                if (!sumMatch) return;
                const amount = Math.abs(parseFloat(sumMatch[0].replace(',', '.')));
                if (!amount || amount > 1000000) return;

                let matchedCat = state.categories[0].id;
                for (let cat of state.categories) {
                    if (cat.keywords.some(kw => lower.includes(kw))) {
                        matchedCat = cat.id;
                        break;
                    }
                }

                state.expenses.push({
                    id: 'imp_' + Math.random(),
                    amount,
                    categoryId: matchedCat,
                    comment: line.substring(0, 30),
                    date: new Date().toISOString()
                });
                addedCount++;
            });

            await saveData();
            closeModal('importModal');
            updateUI();
            alert(`Успешно импортировано операций: ${addedCount}`);
        };

        window.openSettingsModal = () => document.getElementById('settingsModal').classList.add('open');

        window.toggleTheme = async () => {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            applyTheme(state.theme);
            document.getElementById('themeSelector').value = state.theme;
            await saveData();
        };

        window.changeThemeSetting = async (theme) => {
            state.theme = theme;
            applyTheme(theme);
            await saveData();
        };

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
        }

        window.switchTab = (tabId, btn) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.dock-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');
        };

        window.exportData = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "budget_backup.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        };

        window.importDataFile = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    state = JSON.parse(e.target.result);
                    await saveData();
                    updateUI();
                    alert('Данные успешно восстановлены!');
                } catch(err) {
                    alert('Ошибка чтения файла бэкапа');
                }
            };
            reader.readAsText(file);
        };
    </script>
</body>
</html>
